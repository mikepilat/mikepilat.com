worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    etag on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        listen [::]:8080;
        root /site;
        index index.html;

        # Cache pages at Cloudflare while browsers revalidate on each visit.
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=3600, stale-while-revalidate=60, stale-if-error=86400";

        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        location /_astro/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000";
        }

        location / {
            # Real static routes only; unknown paths must not return the homepage.
            try_files $uri $uri/ =404;
        }

        # Do not cache errors, including missing fingerprinted assets.
        error_page 404 /404.html;
        location = /404.html {
            internal;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;
            return 404 "Not found\n";
        }
    }
}
